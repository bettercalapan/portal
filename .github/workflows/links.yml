name: Links

on: push

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lychee
        env:
          LYCHEE_VERSION: 0.24.2
        shell: bash
        run: |
          set -euo pipefail
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          install_dir="$RUNNER_TEMP/lychee"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sha256" "$release/$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check "$archive.sha256")
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$install_dir"
          lychee_path="$(find "$install_dir" -type f -name lychee -print -quit)"
          test -n "$lychee_path"
          sudo install --mode 0755 "$lychee_path" /usr/local/bin/lychee
          lychee --version

      - name: Check external links
        run: pnpm lychee:ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
